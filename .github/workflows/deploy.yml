name: Build and Deploy Pyxel Web

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies & Pyxel
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package Pyxel App to HTML
        run: |
          # 1. Genera los assets necesarios
          cd src/tools
          python generate_assets.py
          cd ../..
          
          # 2. Genera la carpeta dist
          mkdir dist
          
          # 3. Empaqueta la carpeta raiz y genera el HTML autonomo
          pyxel package . main.py
          pyxel app2html QuestForAethelgard.pyxapp
          mv QuestForAethelgard.html dist/index.html
          
          # 4. Copia los archivos del manifest e iconos a dist/
          cp manifest.json dist/
          cp icon-192.png dist/
          cp icon-512.png dist/
          
          # 5. Inyecta los tags en el <head> del HTML generado por Pyxel
          python -c '
          with open("dist/index.html", "r", encoding="utf-8") as f:
              html = f.read()
          
          tags = """
          <link rel="manifest" href="manifest.json">
          <meta name="theme-color" content="#000000">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <link rel="apple-touch-icon" href="icon-512.png">
          </head>"""
          
          html = html.replace("</head>", tags, 1)
          
          with open("dist/index.html", "w", encoding="utf-8") as f:
              f.write(html)
          '

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
