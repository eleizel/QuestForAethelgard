name: Build and Deploy Pyxel Web

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies & Pyxel
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package Pyxel App to HTML
        run: |
          # 1. Genera los assets necesarios
          cd src/tools
          python generate_assets.py
          cd ../..
          
          # 2. Genera la carpeta dist
          mkdir dist
          
          # 3. Empaqueta la carpeta raiz y genera el HTML autonomo
          pyxel package . main.py
          pyxel app2html QuestForAethelgard.pyxapp
          mv QuestForAethelgard.html dist/index.html
          
          # 4. Copia los archivos del manifest e iconos a dist/
          cp assets/manifest.json dist/
          cp assets/icon-192.png dist/
          cp assets/icon-512.png dist/
          cp assets/screenshots/* dist/
          cp -r assets/.well-known/* dist/.well-known/
          
          # 5. Inyecta los tags con el script de parchado
          python src/tools/patch_html.py

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
