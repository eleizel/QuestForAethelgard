name: Build and Deploy Pyxel Web

on:
  push:
    branches: [ feat/biome-progression-5680891783018994435 ]  # O 'master' según tu rama
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies & Pyxel
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package Pyxel App to HTML
        run: |
          # Genera los assets necesarios
          cd src/tools
          python generate_assets.py
          cd ../..
          # Genera la carpeta dist
          mkdir dist
          # Empaqueta la carpeta raíz indicando tu script inicial (ej. main.py)
          pyxel package . main.py
          # Convierte el archivo .pyxapp a HTML autónomo dentro de /dist
          pyxel app2html QuestForAethelgard.pyxapp
          mv QuestForAethelgard.html dist/index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
