name: Build and Deploy Dual-Frontend Web & Desktop

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates (Python 3.12)
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "ruff>=0.8.0,<1.0.0" "soundfile>=0.12.0,<1.0.0"

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run correctness lint
        run: ruff check src tests tools

      - name: Verify manifest-referenced assets
        run: python tools/verify_assets.py

      - name: Run full headless test suite
        run: python -m pytest -q

  build-web:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "soundfile>=0.12.0,<1.0.0" 

      - name: Generate Retro Game Assets
        run: |
          python src/tools/generate_assets.py

      - name: Build Dual-Frontend Web Deployment (Pygame-CE + Pyxel)
        run: |
          python tools/build_web.py

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/web'

  deploy-pages:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-desktop:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Retro Game Assets
        run: |
          python src/tools/generate_assets.py

      - name: Build Standalone Windows Executable
        run: |
          python tools/build_desktop.py

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestForAethelgard-Windows-Desktop
          path: dist/desktop/QuestForAethelgard.exe
